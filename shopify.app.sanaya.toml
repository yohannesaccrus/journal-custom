# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "d9c5deef4c461419ded1d4a2e2cf184a"
name = "Journal Customizer - Sanaya"
application_url = "https://example.com"
embedded = false

[webhooks]
api_version = "2026-07"

  # Rebuilds the storefront's customizer stock (shop metafield sanaya.cz_stock_public) whenever an
  # order uses assets or gives them back. See src/app/api/webhooks/orders/route.ts.
  [[webhooks.subscriptions]]
  topics = [ "orders/create", "orders/cancelled" ]
  uri = "https://journal-custom.vercel.app/api/webhooks/orders"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,write_draft_orders,write_files,write_inventory,read_inventory,read_markets,write_markets,read_orders,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://journal-custom.vercel.app/api/admin/auth/shopify/callback",
  "http://localhost:3000/api/admin/auth/shopify/callback"
]
